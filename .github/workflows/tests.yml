name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q custom_components
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - run: python scripts/check_wheel.py dist/*.whl
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: '0.13.366'
            serialx: '1.10.0'
          - plugin: '0.13.375'
            serialx: '1.11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.plugin }} aiousbwatcher==1.1.2 serialx==${{ matrix.serialx }}
      - run: PYTHONPATH=. python -m pytest -c runtime_tests/pytest.ini runtime_tests -q
