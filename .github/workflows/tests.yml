name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q custom_components
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ['0.13.366', '0.13.375']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.plugin }} aiousbwatcher==1.1.2 serialx==1.10.0
      - run: PYTHONPATH=. python -m pytest -c runtime_tests/pytest.ini runtime_tests -q
